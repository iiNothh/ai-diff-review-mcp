name: Build VSIX

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Compile typescript
        run: npm run compile
      - name: Package VSIX
        run: npx @vscode/vsce package --allow-missing-repository --allow-star-activation
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-diff-mcp-vsix
          path: '*.vsix'
